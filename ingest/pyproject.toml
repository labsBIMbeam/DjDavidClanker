[project]
name = "dj-crate-ingest"
version = "0.1.0"
description = "Crate ingest: upload / watch folder / magnet -> loudness -> tags -> library"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "mutagen>=1.47",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Deliberately NOT selecting BLE (blind except): the worker and the handler
# registry swallow broad exceptions by design — a broken file or a bad
# third-party handler must never stall the queue. Failures are logged and
# quarantined instead.
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
